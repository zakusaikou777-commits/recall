<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Recall に保存</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">
  <header class="head">
    <img id="fav" class="favicon" alt="">
    <div class="grow">
      <div id="state" class="state">新規保存</div>
    </div>
    <button id="toLib" class="btn ghost sm" title="ライブラリを開く (Alt+Shift+S)">ライブラリ</button>
  </header>

  <div id="dueBanner" class="banner hidden">
    <span id="dueText"></span>
    <button id="goReview" class="btn sm">復習する</button>
  </div>

  <div id="savedInfo" class="savedinfo hidden">
    <span id="savedDue"></span>
    <div class="grow"></div>
    <button id="pAgain" class="btn sm">まだ</button>
    <button id="pOk" class="btn sm">覚えた</button>
  </div>

  <main class="body">
    <div id="thumbWrap" class="thumbwrap hidden">
      <img id="thumb" alt="">
      <span id="thumbDur" class="thumbdur hidden"></span>
    </div>

    <div class="field">
      <label for="title">タイトル</label>
      <input id="title" type="text" autocomplete="off" spellcheck="false">
      <div id="url" class="url truncate faint"></div>
      <div id="site" class="url truncate faint"></div>
    </div>

    <div class="field">
      <label>カテゴリ <span id="catHint" class="faint"></span></label>
      <div id="cats" class="cats"></div>
      <div id="newCatRow" class="row hidden">
        <input id="newCat" type="text" placeholder="新しいカテゴリ名" maxlength="20">
        <button id="newCatOk" class="btn sm primary">追加</button>
        <button id="newCatCancel" class="btn sm ghost">×</button>
      </div>
    </div>

    <div class="field">
      <label for="tagInput">タグ</label>
      <div id="tagBox" class="tagbox">
        <span id="tagChips" class="tagchips"></span>
        <input id="tagInput" type="text" list="tagList" placeholder="タグを入力して Enter" autocomplete="off">
      </div>
      <datalist id="tagList"></datalist>
      <div id="tagSug" class="tagsug"></div>
    </div>

    <div class="field">
      <label for="note">メモ <span class="faint" id="noteCount"></span></label>
      <textarea id="note" placeholder="覚えておきたいポイント（任意）" maxlength="1200"></textarea>
    </div>

    <div class="field">
      <label for="iv">復習の間隔</label>
      <select id="iv"></select>
      <div id="ivHint" class="faint hint"></div>
    </div>
  </main>

  <div id="knRow" class="savedinfo hidden">
    <span id="knText"></span>
    <div class="grow"></div>
    <button id="knSend" class="btn sm hidden">気になり帳へ送る</button>
  </div>

  <footer class="foot">
    <button id="del" class="btn danger sm hidden">削除</button>
    <div class="grow"></div>
    <span id="msg" class="msg"></span>
    <button id="save" class="btn primary">保存<span class="kbd">⌘⏎</span></button>
  </footer>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
